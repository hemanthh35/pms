services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: civicai
      POSTGRES_PASSWORD: civicai
    ports:
      - "5432:5432"
    volumes:
      - civicai_postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://civicai:civicai@postgres:5432/civicai
      SECRET_KEY: civicai-local-docker-secret
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  civicai_postgres:

