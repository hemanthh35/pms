services:
  - type: web
    name: civicconnect
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: FRONTEND_DIST_DIR
        value: /app/frontend/dist
      - key: FRONTEND_ORIGIN
        value: https://pms-5n65.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: complaint-images
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@civicconnect.app
    disk:
      name: civicconnect-data
      mountPath: /var/data
      sizeGB: 1
