services:
  - type: web
    name: civicconnect
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: FRONTEND_DIST_DIR
        value: /app/frontend/dist
      - key: FRONTEND_ORIGIN
        value: https://civicconnect.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: civicconnect-data
      mountPath: /var/data
      sizeGB: 1
